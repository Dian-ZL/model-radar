name: Publish model radar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: model-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Check scripts and stage static site
        run: |
          mkdir site
          for file in *.js; do node --check "$file"; done
          cp index.html style.css *.js site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
